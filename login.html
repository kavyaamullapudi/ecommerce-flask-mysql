{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-art"><span class="auth-art-icon">✳</span><p>Good things<br>are just a click away.</p></div><div class="auth-panel"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Enter your account details to continue.</p><form method="post" class="form-stack"><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="255"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-dark button-wide" type="submit">Log in</button></form><p class="auth-switch">New to ShopNest? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
