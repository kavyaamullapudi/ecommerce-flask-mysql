{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-art"><span class="auth-art-icon">✳</span><p>Your next<br>favourite thing awaits.</p></div><div class="auth-panel"><p class="eyebrow">JOIN SHOPNEST</p><h1>Create account</h1><p class="muted">Set up an account to place and track orders.</p><form method="post" class="form-stack"><label>Full name<input type="text" name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input type="email" name="email" required maxlength="255" autocomplete="email"></label><label>Password <span class="muted small">(8 characters minimum)</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="button button-dark button-wide" type="submit">Create account</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
