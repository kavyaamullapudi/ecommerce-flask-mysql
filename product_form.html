{% extends "base.html" %}{% block title %}{{ page_title }}{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('admin_dashboard') }}">← Back to dashboard</a><section class="form-page"><p class="eyebrow">PRODUCT MANAGEMENT</p><h1>{{ page_title }}</h1><p class="muted">Fields marked with * are required.</p><form method="post" class="form-stack"><label>Product name *<input name="name" required maxlength="150" value="{{ product.name if product else '' }}"></label><label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><div class="form-row"><label>Price (₹) *<input type="number" name="price" min="0" step="0.01" required value="{{ '%.2f'|format(product.price) if product else '' }}"></label><label>Stock quantity *<input type="number" name="stock" min="0" step="1" required value="{{ product.stock if product else 0 }}"></label></div><div class="form-row"><label>Category<input name="category" maxlength="80" value="{{ product.category if product else 'General' }}"></label><label>Image URL<input type="url" name="image_url" maxlength="500" placeholder="https://..." value="{{ product.image_url if product and product.image_url else '' }}"></label></div><div class="form-actions"><button class="button button-dark" type="submit">Save product</button><a class="button button-outline" href="{{ url_for('admin_dashboard') }}">Cancel</a></div></form></section>{% endblock %}
